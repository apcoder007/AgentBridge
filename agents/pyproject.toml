[project]
name = "langgraph-agent-api"
version = "0.1.0"
description = "A LangGraph agent exposed through FastAPI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
